[package]
name = "shotcraft"
version = "0.2.2"
edition = "2021"
license = "MIT"

[[bin]]
name = "shotcraft"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
tiny-skia = "0.11"
resvg = { version = "0.45", default-features = false }
ab_glyph = "0.2"
arboard = "3"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }

# Windows and Linux: everything macOS gets from its own frameworks (screencapture, Vision, the menu bar).
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dependencies]
global-hotkey = "0.8"
dirs = "6"
notify-rust = "4"
rxing = { version = "0.9", default-features = false, features = ["decoders", "multi_barcode_readers", "full_barcode_format_support", "encoding_rs"] }

[target.'cfg(target_os = "windows")'.dependencies]
tray-icon = "0.25"
xcap = { version = "0.9", default-features = false }
winreg = "0.55"
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_System_WinRT", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Storage_Xps", "Win32_System_Com", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Controls_Dialogs", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[target.'cfg(target_os = "linux")'.dependencies]
ksni = { version = "0.3", default-features = false, features = ["async-io", "blocking"] }
x11rb = { version = "0.13", features = ["randr", "xfixes", "xtest"] }
ashpd = { version = "0.13", default-features = false, features = ["async-io", "screenshot"] }
flate2 = "1"
futures-lite = "2"
libc = "0.2"
raw-window-handle = "0.6"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
async-io = "2"
ocrs = { version = "0.13", default-features = false, features = ["onnx"] }
rten = { version = "0.26", default-features = false, features = ["onnx_format"] }

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8"
tray-icon = "0.25"
objc2 = "0.6"
winit = "0.30"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem", "NSImage", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSEvent", "NSImageView", "NSPrintInfo", "NSPrintOperation", "NSView", "NSControl", "NSResponder", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSWindow", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSDictionary", "NSString", "NSError", "NSValue", "NSGeometry", "NSLocale"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-vision = "0.3"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2

# The Linux text recognizer also runs in Windows test builds, so its tests run on this PC.
[target.'cfg(target_os = "windows")'.dev-dependencies]
ocrs = { version = "0.13", default-features = false, features = ["onnx"] }
rten = { version = "0.26", default-features = false, features = ["onnx_format"] }

# The tests draw a QR code to read back.
[target.'cfg(any(target_os = "windows", target_os = "linux"))'.dev-dependencies]
rxing = { version = "0.9", default-features = false, features = ["encoders", "decoders", "multi_barcode_readers", "full_barcode_format_support", "encoding_rs"] }
