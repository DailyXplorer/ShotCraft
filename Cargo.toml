[package]
name = "shotcraft"
version = "0.2.1"
edition = "2021"
license = "MIT"

[[bin]]
name = "shotcraft"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
tiny-skia = "0.11"
resvg = { version = "0.45", default-features = false }
ab_glyph = "0.2"
arboard = "3"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "macos")'.dependencies]
global-hotkey = "0.8"
tray-icon = "0.25"
objc2 = "0.6"
winit = "0.30"
objc2-app-kit = { version = "0.3", features = ["NSMenu", "NSMenuItem", "NSImage", "NSWorkspace", "NSRunningApplication", "NSScreen", "NSEvent", "NSImageView", "NSPrintInfo", "NSPrintOperation", "NSView", "NSControl", "NSResponder", "NSDragging", "NSDraggingItem", "NSDraggingSession", "NSPasteboard", "NSWindow", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSBundle", "NSData", "NSDictionary", "NSString", "NSError", "NSValue", "NSGeometry", "NSLocale"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-vision = "0.3"

[profile.release]
opt-level = 3

[profile.dev]
opt-level = 2
